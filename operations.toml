## extract all other files from the archives
## .preinstanced, .ps3, .xml, .txd, .lh2, .alb, .ctb, .dat, .graph, .rcm_b, .sbk, .bsp, .smb, .mib, .amb, .uix, .imb, .toc, .msb, .inf, .bin, .aub, .txt, files with no extension
## only .preinstanced, .txd, are used
[[operation]]
Name = "Extract Archives (.STR)"
run-all = true
Instructions = "run quickbms script using {{Game_Root}}/operations/simpsons_str.bms"
script_type = "bms"
script = "{{Game_Root}}/operations/simpsons_str.bms"
input = "{{SourcePath}}"
output = "{{Game_Root}}/GameFiles/STROUT"
extension = ".str"


## blender cannot handle paths that exeed windows path limits
## blender refused to accept my solutions to this so i did two things to ensure it works for -
## blender and any other application that needs to handle the files
## this process specificaly reduces redundent directory structurs without removing improtant path data
[[operation]]
Name = "flatten folder structure"
Instructions = "run flatten script"
run-all = false
script_type = "engine"
script = "flatten"
args = ["{{SourcePath}}", "{{Game_Root}}/SourceFlat", "--rules", "{{Game_Root}}/config/PathRules.json", "--separator", "^", "--action", "copy", "--ignore", "audiostreams", "--ignore", "movies"]

## extract textures from texture dictionaries that were extracted from .str files
[[operation]]
Name = "Extract Textures (.txd -> .dds)"
run-all = true
script_type = "engine"
script = "format-extract"
format = "txd"
args = ["{{Game_Root}}/GameFiles/STROUT"]

[[operation]]
Name = "Convert Textures (.dds -> .png)"
run-all = true
script_type = "engine"
script = "format-convert"
tool = "ImageMagick"
args = [
	"--source", "{{Game_Root}}/GameFiles/STROUT",
	"--target", "{{Game_Root}}/GameFiles/STROUT",
	"--input-ext", ".dds",
	"--output-ext", ".png"
]

## validate extraction of str and txd files 
[[operation]]
Name = "validate extracted game files"

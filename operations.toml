

# Placeholders: Game_Root, Project_Root are built into the engine

# validate-files operations cannot be run until the indexing db's are generated manually
## there could be two different indexes, a source index for us and eu thats packed with the repo,
## and a index that is generated in this after some processes just before blender so blender has a texture index to find the extracted textures
## this would mean no intermediary validation would be possible as thered be no source of truth, since creating an index of the files you have isnt validation that the output is correct but as long as the input is correct it should generally be fine


## creates config.toml and ensures placeholders exist
## operations marked with init = true are not displayed in interactive UI or GUI lists to ensure they are always run every time
##  - ensure placeholders exist: SourcePath, Region
##  - create ./config.toml on first run if missing
##  - verify {{SourcePath}}/{{Region}}/{{PostSourcePath}} exists and is readable
## get user input for values like region and path if needed
[[operation]]
id = 0
init = true
run-all = true # rerun when using run-all to ensure config is valid
depends-on = []
script_type = "lua"
script = "{{Game_Root}}/operations/init.lua"

## dev test, change region to EU or US, also change SourcePath to //US or //EU paths
[[operation]]
id = -4
Name = "change region to US"
script_type = "engine"
script = "config"
args = [
    "--group", "placeholders",
    "--set", "Region=US:string",
    "--set", "MainSourcePath={{Game_Root}}/Source/US/PS3_GAME/USRDIR:string"
]
[[operation]]
id = -2
Name = "change region to EU"
script_type = "engine"
script = "config"
args = [
    "--group", "placeholders",
    "--set", "Region=EU:string",
    "--set", "MainSourcePath={{Game_Root}}/Source/EU/PS3_GAME/USRDIR:string"
]



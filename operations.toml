## the longest path being 348 characters long is a problem for blender and godot, mostly godot now
##
## blender cannot handle paths that exeed windows path limits
## blender refused to accept my solutions to this so i did two things to ensure it works for -
## blender and any other application that needs to handle the files
## blender is currently solved using symbolic links for assets, and \\?\ for texture paths, this (\\?\) actually working indicates the i dont need the sym links for blender and could just use \\?\ for assets as well
## the same issue also occurs in godots virtual file system, the only solution there is to flatten the folder structure
## this process specificaly reduces redundent directory structurs without removing improtant path data
#[[operation]] old C# flattener, replaced by lua normalizer
#id = 7
#Name = "flatten folder structure"
#run-all = false
#depends-on = [0]
#script_type = "engine"
#script = "flatten"
#args = ["{{SourcePath}}", "{{Game_Root}}/SourceFlat", "--rules", "{{Game_Root}}/config/PathRules.json", "--separator", "^", "--action", "copy", "--ignore", "audiostreams", "--ignore", "movies"]
[[operation]]
id = 7
Name = "Normalize folder structure"
run-all = true
depends-on = [0]
script_type = "lua"
script = "{{Game_Root}}/operations/DirectoryNormalizer.lua"
args = ["{{Game_Root}}/GameFiles/{{STROUT}}", "{{Game_Root}}/GameFiles/{{STROUT}}_Normalized", "--rules", "{{Game_Root}}/config/DirectoryNormalizer.rules.json", "--action", "copy", "--ignore", "audiostreams", "--ignore", "movies"]
[[operation.prompts]]
type = "confirm"
Name = "dry run?"
message = "dry run (no files will be copied)?"
default = false
cli_arg = "--dry-run"
[[operation.onsuccess]] # when successful, update placeholders to normalized
Name = "update normalized placeholders"
script_type = "lua"
script = "{{Game_Root}}/config.lua"
args = ["--group", "placeholders", "--set", "STROUT=STROUT_Normalized:string", "--set", "Type=FullFlattened:string"]



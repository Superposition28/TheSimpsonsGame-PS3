## extract all other files from the archives
## .preinstanced, .ps3, .xml, .txd, .lh2, .alb, .ctb, .dat, .graph, .rcm_b, .sbk, .bsp, .smb, .mib, .amb, .uix, .imb, .toc, .msb, .inf, .bin, .aub, .txt, files with no extension
## only .preinstanced, .txd, are used
[[operation]]
id = 6
Name = "Extract Archives (.STR)"
run-all = true
depends-on = [0,2] # depends on bms tool being downloaded
script_type = "bms"
script = "{{Game_Root}}/operations/simpsons_str.bms"
input = "{{SourcePath}}/{{Region}}/{{PostSourcePath}}"
output = "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}" # always output to STROUT not {{STROUT}}
extension = ".str"

## extract textures from texture dictionaries that were extracted from .str files
[[operation]]
id = 8
Name = "Extract Textures (.txd -> .dds)"
run-all = true
depends-on = [0,7]
script_type = "engine"
script = "format-extract"
format = "txd"
args = ["{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}"]

[[operation]]
id = 9
Name = "Convert Textures (.dds -> .png)"
run-all = true
depends-on = [0,7,8,2]
script_type = "engine"
script = "format-convert"
tool = "ImageMagick"
args = [
    "--source", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "--target", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "--input-ext", ".dds",
    "--output-ext", ".png"
]


# convert all lh2 dialogue/subtitles to csv
[[operation]]
id = 17
Name = "Extract Dialogue/Subtitles (.lh2 -> .csv)"
run-all = true
depends-on = [0]
script_type = "lua"
script = "{{Game_Root}}/operations/lh2_to_csv.lua"
args = [
    "--input-dir", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}"
    # auto output to same location as input files
]




## convert 3d models into .blend files, and export to glb for godot use
## auto apply textures within blender as well, however materials will need to be manually adjusted within godot
[[operation]]
id = 11
Name = "Convert Models (.preinstanced -> .blend)"
run-all = true
depends-on = [0,2,6,8,9] # depends on blender, str extraction for assets, and texture extraction and conversion for materials
script_type = "lua"
script = "{{Game_Root}}/operations/Blender/run.lua"
args = [
	"--game-root", "{{Game_Root}}",
	"--base-dir", "{{Game_Root}}",
	"--operations-dir", "{{Game_Root}}/operations",
	"--blender-dir", "{{Game_Root}}/operations/Blender",
	"--preinstanced-dir", "{{Game_Root}}/GameFiles/{{STROUT}}",
	"--blend-dir", "{{Game_Root}}/GameFiles/{{STROUT}}",
	"--blank-blend", "{{Game_Root}}/blank.blend",
	"--root-drive", "{{Game_Root}}/TMP_TSG_LNKS",
	"--main-db", "{{Game_Root}}/config/GameFilesIndex_{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}.db",
]
# for debugging
[[operation.prompts]]
type = "confirm"
Name = "verbose"
message = "Model Conversion: Enable verbose output?"
default = false
cli_arg = "--verbose"
# for debugging
[[operation.prompts]]
type = "confirm"
Name = "debug mode"
message = "Model Conversion: Enable debug mode?"
default = false
cli_arg = "--debug-sleep"
## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "confirm"
Name = "enable_export"
message = "Model Conversion: Export additional formats (FBX/GLTF)?"
default = true
## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "checkbox"
Name = "export_formats"
message = "Select export formats:"
default = ["glb"]
choices = ["fbx", "glb"]
cli_prefix = "--export"
condition = "enable_export"
validation = { required = true, message = "You must select at least one format." }

## convert videos into a usable format for godot
[[operation]]
id = 12
Name = "Convert Videos (.vp6 -> .ogv)"
run-all = false
depends-on = [0,2] # depends on ffmpeg being downloaded
script_type = "engine"
script = "format-convert"
tool = "ffmpeg"
args = [
	"-m", "ffmpeg",
	"--type", "video",
	## doesnt need to specify the location of the movies folder as its within the source path and {{STROUT}} and the only location vp6 files exist
	"-s", "{{SourcePath}}",
	"-t", "{{Game_Root}}/GameFiles/{{STROUT}}",
	#"-f", "ffmpeg.exe",
	"-i", ".vp6",
	"-o", ".ogv"
]

## convert Audio into a usable format for godot
[[operation]]
id = 13
Name = "Convert Audio (.snu -> .wav)"
run-all = false
depends-on = [0,2] # depends on vgmstream being downloaded, could depend on audio reorg but that is technically optional
script_type = "engine"
script = "format-convert"
tool = "vgmstream"
args = [
	"-m", "vgmstream",
	"--type", "audio",
	## doesnt need to specify the location of the audiostreams folder as its within the source path and {{STROUT}} and the only location snu files exist
	"-s", "{{SourcePath}}",
	"-t", "{{Game_Root}}/GameFiles/{{STROUT}}",
	#"--vgmstream-cli", "vgmstream-cli.exe",
	"-i", ".snu",
	"-o", ".wav",
	"--godot-compatible"
]


## convert 3d models into .blend files, and export to glb for godot use
## auto apply textures within blender as well, however materials will need to be manually adjusted within godot
[[operation]]
id = 11
Name = "Convert Models (.preinstanced -> .blend)"
run-all = true
depends-on = [0,2,6,8,9] # depends on blender, str extraction for assets, and texture extraction and conversion for materials
script_type = "lua"
script = "{{Game_Root}}/operations/Blender/run.lua"
args = [
    "--game-root", "{{Game_Root}}",
    "--base-dir", "{{Game_Root}}",
    "--operations-dir", "{{Game_Root}}/operations",
    "--blender-dir", "{{Game_Root}}/operations/Blender",
    "--preinstanced-dir", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "--blend-dir", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "--blank-blend", "{{Game_Root}}/blank.blend",
    "--root-drive", "{{Game_Root}}/TMP_TSG_LNKS-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}", # symbolic link root to avoid path length issues
    "--main-db", "{{Game_Root}}/config/GameFilesIndex_{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}.db",
    "--asset-map-db", "{{Game_Root}}/GameFiles/config/{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}/AssetMap.sqlite",
]
# for debugging
[[operation.prompts]]
type = "confirm"
Name = "verbose"
message = "Model Conversion: Enable verbose output?"
default = false
cli_arg = "--verbose"
# for debugging
[[operation.prompts]]
type = "confirm"
Name = "debug mode"
message = "Model Conversion: Enable debug mode?"
default = false
cli_arg = "--debug-sleep"
## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "confirm"
Name = "enable_export"
message = "Model Conversion: Export additional formats (FBX/GLTF)?"
default = true
## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "checkbox"
Name = "export_formats"
message = "Select export formats:"
default = ["glb"]
choices = ["fbx", "glb"]
cli_prefix = "--export"
condition = "enable_export"
validation = { required = true, message = "You must select at least one format." }




## convert videos into a usable format for godot
[[operation]]
id = 12
Name = "Convert Videos (.vp6 -> .ogv)"
run-all = true
depends-on = [0,2] # depends on ffmpeg being downloaded
script_type = "engine"
script = "format-convert"
tool = "ffmpeg"
args = [
    "-m", "ffmpeg",
    "--type", "video",
    ## doesnt need to specify the location of the movies folder as its within the source path and {{STROUT}} and the only location vp6 files exist
    "-s", "{{SourcePath}}/{{Region}}/{{PostSourcePath}}",
    "-t", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    #"-f", "ffmpeg.exe",
    "-i", ".vp6",
    "-o", ".ogv"
]

## convert Audio into a usable format for godot
[[operation]]
id = 13
Name = "Convert Audio (.snu -> .wav)"
run-all = true
depends-on = [0,2] # depends on vgmstream being downloaded, could depend on audio reorg but that is technically optional
script_type = "engine"
script = "format-convert"
tool = "vgmstream"
args = [
    "-m", "vgmstream",
    "--type", "audio",
    ## doesnt need to specify the location of the audiostreams folder as its within the source path and {{STROUT}} and the only location snu files exist
    "-s", "{{SourcePath}}/{{Region}}/{{PostSourcePath}}",
    "-t", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "-i", ".snu",
    "-o", ".wav",
    "--godot-compatible"
]

## creates EN folder to match language folder patterns in EU ver
## creates Global folder for non language specific audio, mostly Ambiants
[[operation]]
id = 4
Name = "Reorganize Audio Files"
run-all = true
depends-on = [0,6,13]
script_type = "lua"
script = "{{Game_Root}}/operations/SetupAudioDir.lua"
args = ["{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}"]
[[operation.onsuccess]] # when successful, update isRenamed placeholder to "isRenamed"
Name = "set audio_state placeholder"
script_type = "engine"
script = "config"
args = ["--group", "placeholders", "--key", "audio_state", "--value", "audio_reorg", "--type", "string"]
[[operation.onsuccess]]
Name = "rename folder STROUT-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}} to STROUT-{{Region}}_{{Type}}-audio_reorg-{{isRenamed}}"
script_type = "lua"
script = "{{Game_Root}}/rename.lua"
args = [
    "--old_path", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-audio_og-{{isRenamed}}",
    "--new_path", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-audio_reorg-{{isRenamed}}"
]


## renames output Game folders for clarity
[[operation]]
id = 3
Name = "Rename base folders"
run-all = true
depends-on = [0,6,12,13]
script_type = "engine"
script = "rename-folders"
args = ["{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}", "--map-db-file", "{{Game_Root}}/config/RenameMap.db"]
[[operation.onsuccess]] # when successful, update {{isRenamed}} placeholder to "isRenamed"
Name = "set isRenamed placeholder"
script_type = "engine"
script = "config"
args = ["--group", "placeholders", "--key", "isRenamed", "--value", "isRenamed", "--type", "string"]
[[operation.onsuccess]]
Name = "rename folder STROUT-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}} to STROUT-{{Region}}_{{Type}}-{{audio_state}}-isRenamed"
script_type = "lua"
script = "{{Game_Root}}/rename.lua"
args = [
    "--old_path", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-notRenamed",
    "--new_path", "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-isRenamed"
]


## ignoring audio/video folder after conversion means those files wont be copied to the final game folder,
## they cant be run in the flattener as theres too many files, so they need to be copied manually or run after the flattener

## blender cannot handle paths that exeed windows path limits
## blender refused to accept my solutions to this so i did two things to ensure it works for -
## blender and any other application that needs to handle the files
## blender is currently solved using symbolic links for assets, and \\?\ for texture paths, this (\\?\) actually working indicates the i dont need the sym links for blender and could just use \\?\ for assets as well
## the same issue also occurs in godots virtual file system, the only solution there is to flatten the folder structure
## this process specificaly reduces redundent directory structurs without removing improtant path data
#[[operation]] old C# flattener, replaced by lua normalizer
#id = 7
#Name = "flatten folder structure"
#run-all = false
#depends-on = [0]
#script_type = "engine"
#script = "flatten"
#args = ["{{SourcePath}}/{{Region}}/{{PostSourcePath}}", "{{Game_Root}}/SourceFlat", "--rules", "{{Game_Root}}/config/PathRules.json", "--separator", "^", "--action", "copy", "--ignore", "audiostreams", "--ignore", "movies"]
[[operation]]
id = 7
Name = "Normalize folder structure"
run-all = true
depends-on = [0]
script_type = "lua"
script = "{{Game_Root}}/operations/DirectoryNormalizer/run.lua"
args = [
    "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}",
    "{{Game_Root}}/GameFiles/{{STROUT}}-{{Region}}_{{Type}}Flattened-{{audio_state}}-{{isRenamed}}",
    #"--rules", "{{Game_Root}}/config/DirectoryNormalizer.rules.json",
    #"--action", "copy",
    "--copyonly", "A1_Audio",
    "--copyonly", "A1_Video",
]
#[[operation.prompts]] Dev option
#type = "confirm"
#Name = "dry run?"
#message = "dry run (no files will be copied)?"
#default = false
#cli_arg = "--dry-run"
[[operation.onsuccess]] # when successful, update placeholders to normalized
Name = "update normalized placeholders"
script_type = "engine"
script = "config"
args = [
    "--group", "placeholders",
    "--set", "Type=FullFlattened:string"
]





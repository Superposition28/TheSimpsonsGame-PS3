

# Placeholders: Game_Root, Project_Root are built into the engine


## creates config.toml and ensures placeholders exist
## operations marked with init = true are not displayed in interactive UI or GUI lists to ensure they are always run every time
##  - ensure placeholders exist: SourcePath, Region
##  - create ./config.toml on first run if missing
##  - verify {{SourcePath}} exists and is readable
## get user input for values like region and path if needed
[[operation]]
id = 0
init = true
run-all = true # rerun when using run-all to ensure config is valid
depends-on = []
script_type = "lua"
script = "{{Game_Root}}/operations/init.lua"


## validates source only files for US and EU
## validates source folders exist changed or unchanged, should be unchanged on first run
[[operation]] ## validation steps dont do anything and only depend on db file thats dynmaically selected based on placeholders
id = 1
Name = "Validate Source Game Files and Folders"
run-all = false
depends-on = [0]
script_type = "engine"
script = "validate-files"
db = "{{Game_Root}}/config/GameFilesIndex_{{Region}}_{{Type}}-{{audio_state}}-{{isRenamed}}.db"
args = [
	"{{SourcePath}}",
	"--tables", "str_index:source_path,video_index:source_path,mus_index:source_path,snu_index:source_path",
	"--required-dirs", "audiostreams||Assets_1_Audio_Streams,movies||Assets_1_Video_Movies,frontend||Assets_2_Frontend,simpsons_chars||Assets_2_Characters_Simpsons,spr_hub||Map_3-00_SprHub,loc||Map_3-01_LandOfChocolate,brt||Map_3-02_BartmanBegins,eighty_bites||Map_3-03_HungryHungryHomer,tree_hugger||Map_3-04_TreeHugger,mob_rules||Map_3-05_MobRules,cheater||Map_3-06_EnterTheCheatrix,dayofthedolphins||Map_3-07_DayOfTheDolphin,colossaldonut||Map_3-08_TheColossalDonut,dayspringfieldstoodstill||Map_3-09_Invasion,bargainbin||Map_3-10_BargainBin,gamehub||Map_3-00_GameHub,neverquest||Map_3-11_NeverQuest,grand_theft_scratchy||Map_3-12_GrandTheftScratchy,medal_of_homer||Map_3-13_MedalOfHomer,bigsuperhappy||Map_3-14_BigSuperHappy,rhymes||Map_3-15_Rhymes,meetthyplayer||Map_3-16_MeetThyPlayer",
]



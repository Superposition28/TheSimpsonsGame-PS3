	"{{Game_Root}}/GameFiles/STROUT",
	"--tables", "preinstanced_index:source_path,txd_index:source_path,dds_index:source_path,png_index:source_path",
	"--required-dirs", "audiostreams||Assets_1_Audio_Streams,movies||Assets_1_Video_Movies,frontend||Assets_2_Frontend,simpsons_chars||Assets_2_Characters_Simpsons,spr_hub||Map_3-00_SprHub,loc||Map_3-01_LandOfChocolate,brt||Map_3-02_BartmanBegins,eighty_bites||Map_3-03_HungryHungryHomer,tree_hugger||Map_3-04_TreeHugger,mob_rules||Map_3-05_MobRules,cheater||Map_3-06_EnterTheCheatrix,dayofthedolphins||Map_3-07_DayOfTheDolphin,colossaldonut||Map_3-08_TheColossalDonut,dayspringfieldstoodstill||Map_3-09_Invasion,bargainbin||Map_3-10_BargainBin,gamehub||Map_3-00_GameHub,neverquest||Map_3-11_NeverQuest,grand_theft_scratchy||Map_3-12_GrandTheftScratchy,medal_of_homer||Map_3-13_MedalOfHomer,bigsuperhappy||Map_3-14_BigSuperHappy,rhymes||Map_3-15_Rhymes,meetthyplayer||Map_3-16_MeetThyPlayer",
]

## blender cannot handle paths that exeed windows path limits
## blender refused to accept my solutions to this so i did two things to ensure it works for -
## blender and any other application that needs to handle the files
## the second solution within the blender init is to create symbolic links to the long paths, this had a noticable impact on reliability
## but the two solutions significantly impact time to complete second only to godot
[[operation]]
Name = "Convert Models (.preinstanced -> .blend)"
run-all = true
script_type = "lua"
script = "{{Game_Root}}/operations/Blender/run.lua"
args = [
	"--game-root", "{{Game_Root}}",
	"--base-dir", "{{Game_Root}}",
	"--operations-dir", "{{Game_Root}}/operations",
	"--blender-dir", "{{Game_Root}}/operations/Blender",
	"--preinstanced-dir", "{{Game_Root}}/GameFiles/STROUT",
	"--blend-dir", "{{Game_Root}}/GameFiles/STROUT",
	"--blank-blend", "{{Game_Root}}/blank.blend",
	"--root-drive", "{{Game_Root}}/TMP_TSG_LNKS"
]

# for debugging
[[operation.prompts]]
type = "confirm"
Name = "verbose"
message = "Model Conversion: Enable verbose output?"
default = false
cli_arg = "--verbose"

# for better debugging
[[operation.prompts]]
type = "confirm"
Name = "debug_sleep"
message = "Model Conversion: Enable debug sleep?"
default = false
cli_arg = "--debug-sleep"

## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "confirm"
Name = "enable_export"
message = "Model Conversion: Export additional formats (FBX/GLTF)?"
default = true

## for direct export to glb or fbx instead of just creating .blend files
[[operation.prompts]]
type = "checkbox"
Name = "export_formats"
message = "Select export formats:"
default = ["glb"]
choices = ["fbx", "glb"]
cli_prefix = "--export"
condition = "enable_export"
validation = { required = true, message = "You must select at least one format." }


## convert videos into a usable format for godot
[[operation]]
Name = "Convert Videos (.vp6 -> .ogv)"
run-all = true
script_type = "engine"
script = "format-convert"
tool = "ffmpeg"
args = [
	"-m", "ffmpeg",
	"--type", "video",
	## doesnt need to specify the location of the movies folder as its within the source path and STROUT and the only location vp6 files exist
	"-s", "{{SourcePath}}",
	"-t", "{{Game_Root}}/GameFiles/STROUT",
	#"-f", "ffmpeg.exe",
	"-i", ".vp6",
	"-o", ".ogv"
]

## convert Audio into a usable format for godot
[[operation]]
Name = "Convert Audio (.snu -> .wav)"
run-all = true
script_type = "engine"
script = "format-convert"
tool = "vgmstream"
args = [
	"-m", "vgmstream",
	"--type", "audio",
	## doesnt need to specify the location of the audiostreams folder as its within the source path and STROUT and the only location snu files exist
	"-s", "{{SourcePath}}",
	"-t", "{{Game_Root}}/GameFiles/STROUT",
	#"--vgmstream-cli", "vgmstream-cli.exe",
	"-i", ".snu",
	"-o", ".wav",
	"--godot-compatible"
]

## final validation of all files before running godot
[[operation]]
Name = "Validate all game files"
run-all = false
Instructions = "Validate extracted files using explicit table + required dir arguments"
script_type = "engine"
script = "validate-files"
db = "{{Game_Root}}/config/GameFilesIndex_{{Region}}_Full-{{audio_state}}-{{isRenamed}}.db"
args = [
	"{{Game_Root}}/GameFiles/STROUT",
	"--tables", "preinstanced_index:source_path,glb_index:source_path,txd_index:source_path,dds_index:source_path,png_index:source_path,audio_wav_index:source_path,video_ogv_index:source_path",
	"--required-dirs", "audiostreams||Assets_1_Audio_Streams,movies||Assets_1_Video_Movies,frontend||Assets_2_Frontend,simpsons_chars||Assets_2_Characters_Simpsons,spr_hub||Map_3-00_SprHub,loc||Map_3-01_LandOfChocolate,brt||Map_3-02_BartmanBegins,eighty_bites||Map_3-03_HungryHungryHomer,tree_hugger||Map_3-04_TreeHugger,mob_rules||Map_3-05_MobRules,cheater||Map_3-06_EnterTheCheatrix,dayofthedolphins||Map_3-07_DayOfTheDolphin,colossaldonut||Map_3-08_TheColossalDonut,dayspringfieldstoodstill||Map_3-09_Invasion,bargainbin||Map_3-10_BargainBin,gamehub||Map_3-00_GameHub,neverquest||Map_3-11_NeverQuest,grand_theft_scratchy||Map_3-12_GrandTheftScratchy,medal_of_homer||Map_3-13_MedalOfHomer,bigsuperhappy||Map_3-14_BigSuperHappy,rhymes||Map_3-15_Rhymes,meetthyplayer||Map_3-16_MeetThyPlayer",
